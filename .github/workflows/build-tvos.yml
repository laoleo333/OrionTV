name: Build OrionTV tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-tvos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      # 1. 禁用预编译静态库的 C++ 严格检查，规避 react-native-tcp-socket 编译错误
      - name: Expo Prebuild
        run: EXPO_NO_TELEMETRY=1 npx expo prebuild --platform ios --clean

      # 2. 安装 CocoaPods 依赖
      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      # 3. 编译 Archive（注入 CLANG_ALLOW_NON_MODULAR_INCLUDES 规避 C++ 头文件错误）
      - name: Build tvOS Archive
        run: |
          xcodebuild archive \
            -workspace ios/OrionTV.xcworkspace \
            -scheme OrionTV \
            -sdk appletvos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OrionTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            GCC_PREPROCESSOR_DEFINITIONS='$PARENT $(inherited) TARGET_OS_TV=1' \
            BUILD_DIR=$RUNNER_TEMP/build

      # 4. 打包无签名 IPA
      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/OrionTV.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r OrionTV-tvOS-Unsigned.ipa Payload

      # 5. 上传 Artifact 供下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-tvOS-IPA
          path: ${{ runner.temp }}/OrionTV-tvOS-Unsigned.ipa
          retention-days: 7
