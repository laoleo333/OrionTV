name: Build OrionTV tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-tvos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      # 1. 注入 EXPO_TV 环境变量，强制 Expo 启用 tvOS 平台配置生成
      - name: Expo Prebuild for tvOS
        env:
          EXPO_TV: "true"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform ios --clean

      # 2. 修改 Podfile，注入 C++ 与 tvOS 兼容参数
      - name: Patch Podfile Safely
        run: |
          node -e '
            const fs = require("fs");
            let podfile = fs.readFileSync("ios/Podfile", "utf8");
            
            const patchCode = `
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] ||= ["$(inherited)"]
                  config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] << "TARGET_OS_TV=1"
                  config.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"
                  config.build_settings["GCC_WARN_INHIBIT_ALL_WARNINGS"] = "YES"
                end
              end
            `;

            podfile = podfile.replace(/post_install\s+do\s+\|installer\|/, "post_install do |installer|\n" + patchCode);
            fs.writeFileSync("ios/Podfile", podfile);
          '

      # 3. 安装 CocoaPods 依赖
      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      # 4. 自动匹配 OrionTV 的 tvOS 专属 Scheme 进行编译
      - name: Build tvOS Archive
        run: |
          # 检查匹配 OrionTV-tvOS 或 OrionTV 的 Scheme
          SCHEME_NAME=$(xcodebuild -list -workspace ios/*.xcworkspace | grep -i "tvOS" | head -n 1 | xargs)
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="OrionTV"
          fi
          echo "Selected Scheme: $SCHEME_NAME"

          xcodebuild archive \
            -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -sdk appletvos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OrionTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=$RUNNER_TEMP/build

      # 5. 打包无签名 IPA
      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/OrionTV.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r OrionTV-tvOS-Unsigned.ipa Payload

      # 6. 上传编译产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-tvOS-IPA
          path: ${{ runner.temp }}/OrionTV-tvOS-Unsigned.ipa
          retention-days: 7
