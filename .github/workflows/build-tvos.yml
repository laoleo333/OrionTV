name: Build OrionTV tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-tvos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      # 1. 动态生成 iOS / tvOS 原生工程
      - name: Expo Prebuild
        run: EXPO_NO_TELEMETRY=1 npx expo prebuild --platform ios --clean

      # 2. 修改 Podfile 注入 post_install 补丁，强制放宽 Xcode 对 tcp-socket 的严格警告检查
      - name: Patch Podfile for tvOS
        run: |
          cat << 'EOF' >> ios/Podfile

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= ['$(inherited)']
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] << 'TARGET_OS_TV=1'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                # 忽略第三方库的严格编译错误警告
                config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
              end
            end
          end
          EOF

      # 3. 执行 Pod 安装
      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      # 4. 执行 tvOS Archive 编译
      - name: Build tvOS Archive
        run: |
          xcodebuild archive \
            -workspace ios/OrionTV.xcworkspace \
            -scheme OrionTV \
            -destination 'generic/platform=tvOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OrionTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=$RUNNER_TEMP/build

      # 5. 打包无签名 IPA
      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/OrionTV.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r OrionTV-tvOS-Unsigned.ipa Payload

      # 6. 上传 IPA 产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-tvOS-IPA
          path: ${{ runner.temp }}/OrionTV-tvOS-Unsigned.ipa
          retention-days: 7
