name: Build OrionTV tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-tvos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      # 使用 Expo 生成原生 iOS/tvOS 工程结构
      - name: Expo Prebuild
        run: npx expo prebuild --platform ios

      # 安装 iOS/tvOS 原生 Pod 依赖
      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      # 编译 Xcode Archive（禁用证书签名）
      - name: Build tvOS Archive
        run: |
          xcodebuild archive \
            -workspace ios/*.xcworkspace \
            -scheme $(xcodebuild -list -workspace ios/*.xcworkspace | grep -i "tvOS" | head -n 1 | xargs) \
            -sdk appletvos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OrionTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=$RUNNER_TEMP/build

      # 打包成无签名 IPA
      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/OrionTV.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r OrionTV-tvOS-Unsigned.ipa Payload

      # 上传编译好的 IPA 文件
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-tvOS-IPA
          path: ${{ runner.temp }}/OrionTV-tvOS-Unsigned.ipa
          retention-days: 7
