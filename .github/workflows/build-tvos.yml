name: Build OrionTV tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-tvos:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      # 1. 动态生成 iOS / tvOS 原生工程
      - name: Expo Prebuild
        run: EXPO_NO_TELEMETRY=1 npx expo prebuild --platform ios --clean

      # 2. 安全地修改 Podfile，在已有的 post_install 内部注入参数（避免重复定义）
      - name: Patch Podfile Safely
        run: |
          node -e '
            const fs = require("fs");
            let podfile = fs.readFileSync("ios/Podfile", "utf8");
            
            const patchCode = `
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] ||= ["$(inherited)"]
                  config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] << "TARGET_OS_TV=1"
                  config.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"
                  config.build_settings["GCC_WARN_INHIBIT_ALL_WARNINGS"] = "YES"
                end
              end
            `;

            // 插入到现有 post_install do |installer| 的第一行内部
            podfile = podfile.replace(/post_install\s+do\s+\|installer\|/, "post_install do |installer|\n" + patchCode);
            fs.writeFileSync("ios/Podfile", podfile);
          '

      # 3. 执行 Pod 安装
      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      # 4. 执行 tvOS Archive 编译
      - name: Build tvOS Archive
        run: |
          xcodebuild archive \
            -workspace ios/OrionTV.xcworkspace \
            -scheme OrionTV \
            -destination 'generic/platform=tvOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OrionTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=$RUNNER_TEMP/build

      # 5. 打包无签名 IPA
      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/OrionTV.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r OrionTV-tvOS-Unsigned.ipa Payload

      # 6. 上传 IPA 产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-tvOS-IPA
          path: ${{ runner.temp }}/OrionTV-tvOS-Unsigned.ipa
          retention-days: 7
